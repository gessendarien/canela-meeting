
<style>
*{box-sizing:border-box;margin:0;padding:0}
.bg{
  min-height:700px;
  background:linear-gradient(135deg,#f5a623 0%,#e8c84a 40%,#5bc8d0 100%);
  display:flex;align-items:center;justify-content:center;padding:2rem 1rem;
}
.card{
  width:320px;
  background:rgba(255,210,100,0.38);
  border:1px solid rgba(255,255,255,0.45);
  border-radius:28px;padding:1.5rem 1.25rem 1rem;
}
.title{text-align:center;font-size:15px;font-weight:700;letter-spacing:.18em;color:#2c1a00;margin-bottom:1rem;}
.top-btns{display:flex;justify-content:center;gap:10px;margin-bottom:1rem;}
.top-btn{
  width:44px;height:44px;border-radius:50%;border:2px solid transparent;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,0.35);transition:all .15s;
}
.top-btn.active{background:#D85A30;border-color:#D85A30;}
.top-btn.selected-indicator{border-color:#fff;box-shadow:0 0 0 2px #D85A30;}
.top-btn svg{width:20px;height:20px;}
.top-btn.active svg{fill:#fff;}
.top-btn:not(.active) svg{fill:#5a3a00;}
.preview{
  border-radius:16px;overflow:hidden;
  background:rgba(255,255,255,0.25);
  border:1px solid rgba(255,255,255,0.5);
  height:148px;position:relative;
  display:flex;align-items:center;justify-content:center;margin-bottom:1.1rem;
}
.live{
  position:absolute;top:8px;left:8px;
  background:rgba(30,30,30,0.7);color:#fff;font-size:11px;font-weight:600;
  padding:3px 10px;border-radius:999px;display:flex;align-items:center;gap:5px;
}
.live-dot{width:7px;height:7px;border-radius:50%;background:#e03a2f;}
.person svg{width:36px;height:36px;fill:rgba(90,50,0,0.5);}
.srow{margin-bottom:.75rem;}
.slabel-row{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;letter-spacing:.08em;color:#3a2200;margin-bottom:4px;}
input[type=range]{width:100%;height:4px;border-radius:4px;-webkit-appearance:none;appearance:none;background:rgba(255,255,255,0.5);outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#D85A30;cursor:pointer;}
.modes{
  display:flex;border-radius:999px;overflow:hidden;
  background:rgba(255,255,255,0.3);border:1px solid rgba(255,255,255,0.5);
  margin-top:.25rem;margin-bottom:1.1rem;
}
.mode-btn{
  flex:1;padding:9px 0;font-size:12px;font-weight:600;border:none;
  background:transparent;cursor:pointer;color:#3a2200;letter-spacing:.04em;
  display:flex;align-items:center;justify-content:center;gap:5px;
}
.mode-btn.active{background:#D85A30;color:#fff;border-radius:999px;}
.stop-wrap{display:flex;justify-content:center;margin-bottom:.75rem;}
.stop-btn{
  width:52px;height:52px;border-radius:50%;
  background:#D85A30;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:opacity .15s;
}
.stop-btn svg{width:24px;height:24px;fill:#fff;}
.footer{text-align:center;font-size:9px;letter-spacing:.12em;color:rgba(60,30,0,0.55);padding-top:.25rem;}
.hint{text-align:center;font-size:10px;color:rgba(60,30,0,0.5);margin-bottom:.5rem;letter-spacing:.04em;}
</style>

<div class="bg">
  <div class="card">
    <div class="title">CANELA</div>

    <div class="top-btns">
      <div class="top-btn active" id="btn-cam" onclick="selectSource('cam')">
        <svg viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      </div>
      <div class="top-btn" id="btn-mic" onclick="selectSource('mic')">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </div>
    </div>

    <div class="preview">
      <div class="live"><div class="live-dot"></div> LIVE</div>
      <div class="person">
        <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8z"/></svg>
      </div>
    </div>

    <div class="srow">
      <div class="slabel-row"><span>BRILLO</span><span id="d-brillo">72%</span></div>
      <input type="range" min="0" max="100" value="72" step="1" oninput="document.getElementById('d-brillo').textContent=this.value+'%'">
    </div>
    <div class="srow">
      <div class="slabel-row"><span>CONTRASTE</span><span id="d-contrast">45%</span></div>
      <input type="range" min="0" max="100" value="45" step="1" oninput="document.getElementById('d-contrast').textContent=this.value+'%'">
    </div>
    <div class="srow">
      <div class="slabel-row"><span>DESENFOQUE</span><span id="d-blur">20%</span></div>
      <input type="range" min="0" max="100" value="20" step="1" oninput="document.getElementById('d-blur').textContent=this.value+'%'">
    </div>

    <div class="modes">
      <button class="mode-btn" id="m-p" onclick="setM('portrait')">
        <svg width="12" height="16" viewBox="0 0 12 16"><rect x="1" y="1" width="10" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        Portrait
      </button>
      <button class="mode-btn active" id="m-l" onclick="setM('landscape')">
        <svg width="16" height="12" viewBox="0 0 16 12"><rect x="1" y="1" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        Landscape
      </button>
    </div>

    <div class="hint" id="hint">Desactivar cámara</div>
    <div class="stop-wrap">
      <button class="stop-btn" id="stop-btn" onclick="toggleMute()">
        <svg id="stop-icon" viewBox="0 0 24 24"></svg>
      </button>
    </div>

    <div class="footer">CANELA ENGINE V0.4.3 OSSIDIAN</div>
  </div>
</div>

<script>
const CAM_ON  = "M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z";
const CAM_OFF = "M21 6.5l-4 4V7c0-.55-.45-1-1-1H9.82L21 17.18V6.5zM3.27 2L2 3.27 4.73 6H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.21 0 .39-.08.54-.18L19.73 21 21 19.73 3.27 2z";
const MIC_ON  = "M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z";
const MIC_OFF = "M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l1.66 1.66c-.71.33-1.5.52-2.31.52-2.76 0-5.3-2.1-5.3-5.1H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c.91-.13 1.77-.45 2.54-.9L19.73 21 21 19.73 4.27 3z";

let source = 'cam';
let muted = false;

function selectSource(s) {
  source = s;
  muted = false;
  document.getElementById('btn-cam').classList.toggle('active', s === 'cam');
  document.getElementById('btn-mic').classList.toggle('active', s === 'mic');
  updateStopBtn();
}

function toggleMute() {
  muted = !muted;
  updateStopBtn();
}

function updateStopBtn() {
  const icon = document.getElementById('stop-icon');
  const hint = document.getElementById('hint');
  const btn  = document.getElementById('stop-btn');
  if (source === 'cam') {
    icon.innerHTML = `<path d="${muted ? CAM_ON : CAM_OFF}"/>`;
    hint.textContent = muted ? 'Activar cámara' : 'Desactivar cámara';
  } else {
    icon.innerHTML = `<path d="${muted ? MIC_ON : MIC_OFF}"/>`;
    hint.textContent = muted ? 'Activar micrófono' : 'Desactivar micrófono';
  }
  btn.style.opacity = muted ? '0.6' : '1';
}

updateStopBtn();

function setM(m){
  document.getElementById('m-p').classList.toggle('active', m==='portrait');
  document.getElementById('m-l').classList.toggle('active', m==='landscape');
}
</script>
